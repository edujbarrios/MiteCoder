profile: balanced
inference:
  backend: llama_cpp
  model: qwen2.5-coder-1.5b-q4
  context_length: 4096
  max_output_tokens: 512
  temperature: 0.0
  top_p: 1.0
  top_k: 1
  seed: 42
  threads: 4
  batch_size: 64
  mmap: true
  mlock: false
retrieval:
  strategy: hybrid
  max_files: 5
  max_lines_per_file: 160
  max_context_tokens: 2800
agent:
  max_steps: 10
  max_llm_calls: 10
  max_tool_calls: 20
  max_wall_seconds: 900
runtime:
  max_ram_mb: 2048
  artifact_dir: runs
testing:
  commands: ["pytest -q"]
  timeout_seconds: 180
